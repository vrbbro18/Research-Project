<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>RFID Smart Speed Monitoring System</title>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
background:linear-gradient(180deg,#07152c,#0c203c);
color:white;
padding:30px;
}

/* HEADER */

.header{
text-align:center;
margin-bottom:25px;
}

.header h1{
font-size:32px;
letter-spacing:1px;
}

#clock{
margin-top:8px;
font-size:18px;
color:#58ff9c;
font-weight:600;
}

/* SECTION */

.section{
background:rgba(255,255,255,0.05);
border-radius:14px;
padding:25px;
margin-bottom:25px;
backdrop-filter:blur(8px);
box-shadow:0 6px 20px rgba(0,0,0,0.3);
}

.section-title{
font-size:20px;
margin-bottom:15px;
display:flex;
align-items:center;
gap:10px;
}

/* DRIVER BUTTONS */

#drivers{
margin-top:15px;
}

.driver-btn{
background:#ffffff;
border:none;
padding:10px 16px;
border-radius:6px;
margin:6px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.driver-btn:hover{
background:#58ff9c;
}

/* LIVE GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:20px;
}

/* CARDS */

.card{
background:rgba(255,255,255,0.06);
border-radius:12px;
padding:20px;
box-shadow:0 4px 16px rgba(0,0,0,0.4);
}

.card-title{
font-size:18px;
margin-bottom:12px;
}

.speed{
font-size:46px;
color:#2fe3ff;
font-weight:bold;
}

.status{
opacity:0.7;
margin-top:6px;
}

</style>

</head>

<body>

<div class="header">
<h1>🚦 RFID Smart Speed Monitoring System</h1>
<div id="clock"></div>
</div>

<!-- DRIVER SELECTION -->

<div class="section">

<div class="section-title">
🔹 Driver Selection
</div>

<div id="drivers">
Waiting for scanned drivers...
</div>

</div>

<!-- LIVE MONITORING -->

<div class="section">

<div class="section-title">
📊 Live Monitoring
</div>

<div class="grid">

<!-- VEHICLE CARD -->

<div class="card">

<div class="card-title">
🚗 Vehicle Entered
</div>

<div id="vehicleDriver">Driver: -</div>
<div id="vehiclePlate">Plate: -</div>
<div id="entryTime">Entry Time: -</div>

</div>

<!-- SPEED CARD -->

<div class="card">

<div class="card-title">
⚡ Speed
</div>

<div class="speed" id="speed">
0 km/h
</div>

<div class="status" id="speedStatus">
Status: -
</div>

</div>

<!-- EXIT CARD -->

<div class="card">

<div class="card-title">
📍 Exit
</div>

<div id="exitDriver">Driver: -</div>
<div id="exitTime">Exit Time: -</div>
<div id="exitStatus">Status: -</div>

</div>

</div>

</div>

<script>

const socket = io()

/* CLOCK */

setInterval(()=>{
document.getElementById("clock").innerText =
new Date().toLocaleString()
},1000)


/* VEHICLE ENTERED */

socket.on("vehicleEntered",(vehicle)=>{

document.getElementById("vehiclePlate").innerText =
"Plate: "+vehicle.vehicle_number

document.getElementById("entryTime").innerText =
"Entry Time: "+new Date().toLocaleTimeString()

})


/* DRIVER SCANNED */

socket.on("driverScanned",(driver)=>{

const btn=document.createElement("button")

btn.className="driver-btn"

btn.innerText=driver.name

btn.onclick=()=>{

fetch("/select-driver",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({driver_id:driver.driver_id})
})

}

document.getElementById("drivers").appendChild(btn)

})


/* DRIVER SELECTED */

socket.on("driverSelected",(data)=>{

document.getElementById("vehicleDriver").innerText =
"Driver: "+data.driver.name

document.getElementById("drivers").innerHTML =
"Driver Selected"

})


/* SPEED UPDATE */

socket.on("speedUpdate",(data)=>{

document.getElementById("speed").innerText =
data.speed.toFixed(1)+" km/h"

let statusText = document.getElementById("speedStatus")

if(data.speed > 110)
{
statusText.innerText = "Status: VIOLATED"
statusText.style.color = "red"
statusText.style.textShadow = "none"
}

else if(data.speed >= 80)
{
statusText.innerText = "Status: SAFE"
statusText.style.color = "orange"
statusText.style.textShadow = "none"
}

else
{
statusText.innerText = "Status: SAFE"
statusText.style.color = "#3cffb4"
statusText.style.textShadow = "none"
}

})


/* EXIT */

socket.on("exitVehicle",(data)=>{

document.getElementById("exitDriver").innerText =
"Driver: "+data.driver

document.getElementById("exitTime").innerText =
"Exit Time: "+new Date().toLocaleTimeString()

document.getElementById("exitStatus").innerText =
"Status: Completed"

})

</script>

</body>
</html>
