<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>
RFID Smart Speed Monitoring System
</title>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:linear-gradient(
180deg,
#07152c,
#0c203c
);
color:white;
padding:30px;
overflow-x:hidden;
}


/* =====================
   POLICE BAR
===================== */

.police-bar{

position:fixed;

top:25px;

right:30px;

width:90px;

height:28px;

border-radius:8px;

background:#111;

display:flex;

overflow:hidden;

box-shadow:
0 0 20px rgba(0,0,0,.5);

}

.red-bar{

flex:1;

background:red;

animation:
redFlash .45s infinite;

}

.blue-bar{

flex:1;

background:#0077ff;

animation:
blueFlash .45s infinite;

}


@keyframes redFlash{

0%{
opacity:1;
box-shadow:
0 0 18px red;
}

50%{
opacity:.15;
}

100%{
opacity:1;
}

}


@keyframes blueFlash{

0%{
opacity:.15;
}

50%{
opacity:1;
box-shadow:
0 0 18px #0077ff;
}

100%{
opacity:.15;
}

}


/* =====================
   HEADER
===================== */

.header{
text-align:center;
margin-bottom:25px;
}

.header h1{
font-size:32px;
letter-spacing:1px;
}


/* =====================
   TRAFFIC LIGHT
===================== */

.traffic{
display:inline-flex;
flex-direction:column;
gap:5px;
margin-right:12px;
vertical-align:middle;
}

.light{
width:16px;
height:16px;
border-radius:50%;
opacity:.25;
}

.red{
background:red;
animation:redBlink 3s infinite;
}

.yellow{
background:yellow;
animation:yellowBlink 3s infinite;
}

.green{
background:#00ff66;
animation:greenBlink 3s infinite;
}


@keyframes redBlink{

0%{
opacity:1;
}

30%{
opacity:1;
}

33%{
opacity:.25;
}

100%{
opacity:.25;
}

}

@keyframes yellowBlink{

0%,30%{
opacity:.25;
}

33%,63%{
opacity:1;
}

66%,100%{
opacity:.25;
}

}

@keyframes greenBlink{

0%,63%{
opacity:.25;
}

66%,100%{
opacity:1;
}

}


#clock{
margin-top:8px;
font-size:18px;
color:#58ff9c;
font-weight:600;
}


/* =====================
   SECTION
===================== */

.section{
background:rgba(255,255,255,.05);
border-radius:16px;
padding:25px;
margin-bottom:25px;
backdrop-filter:blur(12px);
box-shadow:
0 8px 30px rgba(0,0,0,.4);
}

.section-title{
font-size:22px;
margin-bottom:15px;
display:flex;
align-items:center;
gap:10px;
}


/* =====================
   BUTTONS
===================== */

#drivers{
margin-top:15px;
}

.driver-btn{

background:white;

border:none;

padding:10px 16px;

border-radius:8px;

margin:6px;

cursor:pointer;

font-weight:600;

transition:.3s;

}

.driver-btn:hover{

transform:scale(1.05);

}


/* =====================
   GRID
===================== */

.grid{
display:grid;
grid-template-columns:
repeat(3,1fr);
gap:20px;
margin-top:20px;
}


/* =====================
   CARDS
===================== */

.card{

background:
rgba(255,255,255,.06);

border-radius:14px;

padding:20px;

box-shadow:
0 4px 18px
rgba(0,0,0,.45);

transition:.3s;

}

.card:hover{

transform:
translateY(-4px);

}

.card-title{
font-size:20px;
margin-bottom:14px;
}

.speed{
font-size:54px;
font-weight:bold;
color:#2fe3ff;
}

.status{
margin-top:10px;
opacity:.8;
}


/* MOBILE */

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>


<!-- POLICE LIGHT -->

<div class="police-bar">

<div class="red-bar"></div>

<div class="blue-bar"></div>

</div>



<!-- HEADER -->

<div class="header">

<h1>

<span class="traffic">

<div class="light red"></div>

<div class="light yellow"></div>

<div class="light green"></div>

</span>

RFID Smart Speed Monitoring System

</h1>

<div id="clock"></div>

</div>



<!-- DRIVER -->

<div class="section">

<div class="section-title">

🔹 Driver Selection

</div>

<div id="drivers">

Waiting for scanned drivers...

</div>

</div>



<!-- LIVE -->

<div class="section">

<div class="section-title">

📊 Live Monitoring

</div>


<div class="grid">


<!-- VEHICLE -->

<div class="card">

<div class="card-title">

🚗 Vehicle Entered

</div>

<div id="vehicleDriver">

Driver: -

</div>

<div id="vehiclePlate">

Plate: -

</div>

<div id="entryTime">

Entry Time: -

</div>

</div>



<!-- SPEED -->

<div class="card">

<div class="card-title">

⚡ Speed

</div>

<div
class="speed"
id="speed"
>

0 km/h

</div>

<div
class="status"
id="speedStatus"
>

Status: -

</div>

</div>



<!-- EXIT -->

<div class="card">

<div class="card-title">

📍 Exit

</div>

<div id="exitDriver">

Driver: -

</div>

<div id="exitTime">

Exit Time: -

</div>

<div id="exitStatus">

Status: -

</div>

</div>


</div>

</div>


<script>

const socket=io()


/* CLOCK */

setInterval(()=>{

document.getElementById(
"clock"
).innerText=

new Date()
.toLocaleString()

},1000)



/* VEHICLE */

socket.on(
"vehicleEntered",
(vehicle)=>{

document.getElementById(
"vehiclePlate"
).innerText=

"Plate: "
+

vehicle
.vehicle_number


document.getElementById(
"entryTime"
).innerText=

"Entry Time: "
+

new Date()
.toLocaleTimeString()

})



/* DRIVER */

socket.on(
"driverScanned",
(driver)=>{

const btn=
document
.createElement(
"button"
)

btn.className=
"driver-btn"

btn.innerText=
driver.name

btn.onclick=
()=>{

fetch(
"/select-driver",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

driver_id:
driver.driver_id

})

})

}

document
.getElementById(
"drivers"
)
.appendChild(btn)

})



/* SELECTED */

socket.on(
"driverSelected",
(data)=>{

document.getElementById(
"vehicleDriver"
).innerText=

"Driver: "
+

data.driver.name


document.getElementById(
"drivers"
).innerHTML=

"Driver Selected"

})



/* SPEED */

socket.on(
"speedUpdate",
(data)=>{

document.getElementById(
"speed"
).innerText=

Number(
data.speed
)
.toFixed(2)

+

" km/h"


let statusText=

document
.getElementById(
"speedStatus"
)


if(
data.speed>110
)
{

statusText.innerText=
"Status: VIOLATED"

statusText.style.color=
"red"

}

else{

statusText.innerText=
"Status: SAFE"

statusText.style.color=
"#3cffb4"

}

})



/* EXIT */

socket.on(
"exitVehicle",
(data)=>{

document.getElementById(
"exitDriver"
).innerText=

"Driver: "
+

data.driver


document.getElementById(
"exitTime"
).innerText=

"Exit Time: "
+

new Date()
.toLocaleTimeString()


document.getElementById(
"exitStatus"
).innerText=

"Status: Completed"

})

</script>

</body>
</html>
